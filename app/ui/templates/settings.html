{% extends "base.html" %}
{% block title %}MTCS — Settings{% endblock %}

{% block content %}
<div class="px-4 py-3" x-data="settingsPanel()" x-init="init()">
    <h2 class="text-lg font-semibold mb-4">Settings</h2>

    <!-- Sections -->
    <div class="space-y-3">
        <!-- Theme -->
        <div class="bg-surface-900/50 rounded-xl p-4 border border-white/5">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Appearance</h3>
            <div class="flex gap-2">
                <button @click="setTheme('dark')" class="flex-1 py-2 rounded-lg text-xs font-medium transition-all"
                    :class="theme === 'dark' ? 'bg-accent text-white' : 'bg-white/5 text-gray-400'">🌙 Dark</button>
                <button @click="setTheme('light')" class="flex-1 py-2 rounded-lg text-xs font-medium transition-all"
                    :class="theme === 'light' ? 'bg-accent text-white' : 'bg-white/5 text-gray-400'">☀️ Light</button>
                <button @click="setTheme('auto')" class="flex-1 py-2 rounded-lg text-xs font-medium transition-all"
                    :class="theme === 'auto' ? 'bg-accent text-white' : 'bg-white/5 text-gray-400'">🔄 Auto</button>
            </div>
        </div>

        <!-- Trading -->
        <div class="bg-surface-900/50 rounded-xl p-4 border border-white/5">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Trading</h3>
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-sm">One-Click Trading</span>
                    <button @click="oneClick = !oneClick; saveSetting('one_click_trading', oneClick)"
                        class="relative w-10 h-5 rounded-full transition-colors"
                        :class="oneClick ? 'bg-profit' : 'bg-gray-700'">
                        <span class="absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform"
                            :class="oneClick ? 'translate-x-5' : 'translate-x-0.5'"></span>
                    </button>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Default Lot Size</label>
                    <input type="number" step="0.01" x-model="defaultLot"
                        @change="saveSetting('default_lot', defaultLot)"
                        class="w-full bg-surface-950 border border-white/10 rounded-lg px-3 py-2 text-sm focus:border-accent outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Max Slippage (points)</label>
                    <input type="number" x-model="maxSlippage" @change="saveSetting('max_slippage', maxSlippage)"
                        class="w-full bg-surface-950 border border-white/10 rounded-lg px-3 py-2 text-sm focus:border-accent outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Max Spread (points)</label>
                    <input type="number" x-model="maxSpread" @change="saveSetting('max_spread', maxSpread)"
                        class="w-full bg-surface-950 border border-white/10 rounded-lg px-3 py-2 text-sm focus:border-accent outline-none">
                </div>
            </div>
        </div>

        <!-- Security -->
        <div class="bg-surface-900/50 rounded-xl p-4 border border-white/5">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Security</h3>
            <div class="flex items-center justify-between">
                <span class="text-sm">PIN Lock</span>
                <button @click="pinEnabled = !pinEnabled" class="relative w-10 h-5 rounded-full transition-colors"
                    :class="pinEnabled ? 'bg-accent' : 'bg-gray-700'">
                    <span class="absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform"
                        :class="pinEnabled ? 'translate-x-5' : 'translate-x-0.5'"></span>
                </button>
            </div>
        </div>

        <!-- Network Info -->
        <div class="bg-surface-900/50 rounded-xl p-4 border border-white/5">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Network</h3>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-gray-400">Local IP</span>
                    <span class="font-mono" x-text="networkInfo.local_ip || '---'"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Port</span>
                    <span class="font-mono" x-text="networkInfo.port || '---'"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Mobile URL</span>
                    <span class="font-mono text-accent text-xs" x-text="networkInfo.access_url || '---'"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Firewall</span>
                    <span class="text-xs" :class="networkInfo.firewall?.allowed ? 'text-profit' : 'text-warn'"
                        x-text="networkInfo.firewall?.allowed ? 'OK' : 'May be blocked'"></span>
                </div>
            </div>
            <div x-show="networkInfo.firewall && !networkInfo.firewall.allowed"
                class="mt-3 text-[10px] text-warn bg-warn/5 rounded-lg p-2.5">
                <p x-text="networkInfo.firewall?.message"></p>
            </div>
        </div>

        <!-- System -->
        <div class="bg-surface-900/50 rounded-xl p-4 border border-white/5">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">System</h3>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-gray-400">Status</span>
                    <span class="text-profit" x-text="systemInfo.system_status || 'unknown'"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">MT5</span>
                    <span :class="systemInfo.mt5_available ? 'text-profit' : 'text-loss'"
                        x-text="systemInfo.mt5_available ? 'Available' : 'Not installed'"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Version</span>
                    <span class="text-gray-300" x-text="systemInfo.version || '1.0.0'"></span>
                </div>
            </div>
        </div>

        <!-- Logs Viewer Link -->
        <div class="bg-surface-900/50 rounded-xl p-4 border border-white/5">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Logs & Audit</h3>
            <div x-data="{ showLogs: false }">
                <button @click="showLogs = !showLogs"
                    class="text-sm text-accent hover:text-accent-light transition-colors">
                    <span x-text="showLogs ? 'Hide Audit Log' : 'View Audit Log'"></span>
                </button>
                <div x-show="showLogs" x-transition class="mt-3 max-h-60 overflow-y-auto space-y-1">
                    <template x-for="entry in auditLog" :key="entry.id">
                        <div class="text-[10px] text-gray-500 font-mono bg-black/20 rounded p-1.5">
                            <span class="text-gray-400" x-text="entry.timestamp"></span>
                            <span class="text-accent ml-1" x-text="entry.event_type"></span>
                            <span class="text-gray-600 ml-1" x-text="entry.details"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function settingsPanel() {
        return {
            theme: localStorage.getItem('theme') || 'dark',
            oneClick: false,
            defaultLot: 0.01,
            maxSlippage: 50,
            maxSpread: 100,
            pinEnabled: false,
            networkInfo: {},
            systemInfo: {},
            auditLog: [],

            async init() {
                // Load settings
                try {
                    const res = await fetch('/api/v1/settings');
                    const data = await res.json();
                    this.oneClick = data.one_click_trading || false;
                    this.defaultLot = data.default_lot || 0.01;
                    this.maxSlippage = data.max_slippage || 50;
                    this.maxSpread = data.max_spread || 100;
                    this.pinEnabled = data.pin_enabled || false;
                } catch (e) { }

                // Load system info
                try {
                    const res = await fetch('/api/v1/settings/system-info');
                    const data = await res.json();
                    this.networkInfo = data.network || {};
                    this.systemInfo = data;
                } catch (e) { }

                // Load audit log
                try {
                    const res = await fetch('/api/v1/history/audit?limit=50');
                    const data = await res.json();
                    this.auditLog = data.audit || [];
                } catch (e) { }
            },

            setTheme(t) {
                this.theme = t;
                localStorage.setItem('theme', t);
                document.documentElement.className = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : '';
            },

            async saveSetting(key, value) {
                try {
                    await fetch('/api/v1/settings/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ [key]: value })
                    });
                } catch (e) { }
            }
        }
    }
</script>
{% endblock %}
