{% extends "base.html" %}
{% block content %}
<div class="space-y-6" x-data="accountsPanel()" x-init="init()">

    <div class="flex items-center justify-between mb-2">
        <h2 class="text-2xl font-bold outfit">Accounts Engine</h2>
    </div>

    <!-- Master Account Card -->
    <div>
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Master Node</h3>

        <template x-if="master">
            <div class="glass-card p-5 border-l-4 border-l-blue-500 relative overflow-hidden group">


                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                            <i data-feather="crosshair" class="w-6 h-6 text-blue-400"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="text-lg font-bold font-mono text-white" x-text="'#' + master.login"></h4>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold tracking-wide border"
                                    :class="master.mt5_connected ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20'"
                                    x-text="master.mt5_connected ? 'LIVE' : 'OFFLINE'"></span>
                            </div>
                            <div class="text-xs text-slate-400 mt-0.5" x-text="master.server"></div>
                            <div class="text-[10px] text-slate-500 mt-1 flex items-center gap-1">
                                <i data-feather="cpu" class="w-3 h-3"></i>
                                <span
                                    x-text="master.worker_alive ? 'Worker PID: ' + master.worker_pid : 'Worker Offline'"></span>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 md:gap-6">
                        <div class="bg-black/20 rounded-xl p-3 border border-white/5 min-w-[100px]">
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Balance</div>
                            <div class="text-base font-mono font-bold text-white"
                                x-text="'$' + (master.balance || 0).toLocaleString()"></div>
                        </div>
                        <div class="bg-black/20 rounded-xl p-3 border border-white/5 min-w-[100px]">
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Equity</div>
                            <div class="text-base font-mono font-bold text-white"
                                x-text="'$' + (master.equity || 0).toLocaleString()"></div>
                        </div>
                        <div class="bg-black/20 rounded-xl p-3 border border-white/5 min-w-[100px]">
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">P&L</div>
                            <div class="text-base font-mono font-bold"
                                :class="(master.profit || 0) >= 0 ? 'text-emerald-400' : 'text-red-400'"
                                x-text="((master.profit || 0) >= 0 ? '+$' : '-$') + Math.abs(master.profit || 0).toFixed(2)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="!master">
            <a href="/"
                class="block glass-card border-dashed border-2 border-slate-700/50 p-8 text-center hover:border-blue-500/50 hover:bg-white/5 transition-all group cursor-pointer">
                <div
                    class="w-12 h-12 rounded-full bg-slate-800 mx-auto flex items-center justify-center group-hover:bg-blue-500/20 group-hover:text-blue-400 transition-colors mb-3">
                    <i data-feather="plus" class="w-6 h-6"></i>
                </div>
                <h4 class="text-sm font-semibold text-slate-300">Set up Primary Master Node</h4>
                <p class="text-xs text-slate-500 mt-1">Connect the account you want to copy trades from.</p>
            </a>
        </template>
    </div>

    <!-- Slaves Grid -->
    <div>
        <div class="flex items-center justify-between mb-4 mt-8">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Slave Nodes</h3>
            <button @click="showAddSlave = true"
                class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 transition-colors text-xs font-semibold border border-blue-500/20">
                <i data-feather="plus-circle" class="w-4 h-4"></i> Add Node
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="(slave, index) in slaves" :key="slave.login">
                <div class="glass-card p-5 relative group"
                    :class="slave.enabled ? 'border-purple-500/30' : 'border-slate-700/50 opacity-75'">

                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm shadow-inner"
                                :class="slave.enabled ? 'bg-gradient-to-br from-purple-500/20 to-blue-500/20 text-purple-300 border border-purple-500/30' : 'bg-slate-800 text-slate-500'">
                                <span x-text="'S' + (index + 1)"></span>
                            </div>
                            <div>
                                <h4 class="font-mono font-bold text-white text-sm" x-text="'#' + slave.login"></h4>
                                <div class="text-[10px] text-slate-400" x-text="slave.server"></div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <!-- Toggle -->
                            <button @click="toggleSlave(slave.login)" title="Toggle Copying"
                                class="relative w-9 h-5 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-purple-500"
                                :class="slave.enabled ? 'bg-purple-500' : 'bg-slate-700'">
                                <span class="absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform"
                                    :class="slave.enabled ? 'translate-x-4.5' : 'translate-x-0.5'"></span>
                            </button>
                        </div>
                    </div>

                    <div class="bg-black/30 rounded-xl p-3 border border-white/5 space-y-2">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">Equity</span>
                            <span class="font-mono font-bold text-white"
                                x-text="'$' + (slave.equity || 0).toLocaleString()"></span>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">P&L</span>
                            <span class="font-mono font-bold"
                                :class="(slave.profit || 0) >= 0 ? 'text-emerald-400' : 'text-red-400'"
                                x-text="((slave.profit || 0) >= 0 ? '+$' : '-$') + Math.abs(slave.profit || 0).toFixed(2)"></span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mt-4">
                        <button @click="openRiskSettings(slave)"
                            class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-medium text-slate-300 transition-colors border border-white/5">
                            <i data-feather="sliders" class="w-3.5 h-3.5"></i> Risk
                        </button>
                        <button @click="removeSlave(slave.login)"
                            class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg bg-red-500/5 hover:bg-red-500/15 text-xs font-medium text-red-400 transition-colors border border-red-500/10">
                            <i data-feather="trash-2" class="w-3.5 h-3.5"></i> Remove
                        </button>
                    </div>

                    <!-- Status indicator -->
                    <div class="absolute bottom-3 pb-0.5 left-1/2 -translate-x-1/2 flex items-center gap-1">
                        <div class="w-1.5 h-1.5 rounded-full"
                            :class="slave.worker_alive && slave.mt5_connected ? 'bg-emerald-500' : 'bg-red-500'"></div>
                        <span class="text-[9px] uppercase tracking-wider"
                            :class="slave.worker_alive && slave.mt5_connected ? 'text-emerald-500' : 'text-red-500'"
                            x-text="slave.worker_alive && slave.mt5_connected ? 'Connected' : 'Offline'"></span>
                    </div>

                </div>
            </template>

            <template x-if="slaves.length === 0">
                <div class="col-span-full border border-dashed border-slate-700/50 rounded-2xl p-8 text-center">
                    <i data-feather="inbox" class="w-8 h-8 mx-auto text-slate-600 mb-2"></i>
                    <p class="text-sm text-slate-400">No slave nodes connected.</p>
                </div>
            </template>
        </div>
    </div>

    <!-- Modals -->

    <!-- Add Slave Modal -->
    <div x-show="showAddSlave" style="display: none;"
        class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-backdrop" @click="showAddSlave = false" x-transition.opacity></div>

        <div class="glass-card relative z-10 w-full max-w-sm p-6 animate-fade-in shadow-2xl border-white/10">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-white">Add Slave Node</h3>
                <button @click="showAddSlave = false" class="text-slate-400 hover:text-white"><i data-feather="x"
                        class="w-5 h-5"></i></button>
            </div>

            <form @submit.prevent="addSlave" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Login</label>
                    <input type="number" x-model="newSlave.login" required class="w-full glass-input px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" x-model="newSlave.password" required
                        class="w-full glass-input px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Server</label>
                    <input type="text" x-model="newSlave.server" required class="w-full glass-input px-3 py-2 text-sm"
                        placeholder="e.g. Exness-MT5Trial">
                </div>

                <div x-show="slaveMessage" class="text-xs p-2 rounded flex items-center gap-2"
                    :class="slaveSuccess ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'">
                    <i data-feather="info" class="w-4 h-4 shrink-0"></i> <span x-text="slaveMessage"></span>
                </div>

                <button type="submit" :disabled="slaveLoading"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center items-center">
                    <i x-show="slaveLoading" data-feather="loader" class="w-4 h-4 mr-2 animate-spin"
                        style="display:none;"></i>
                    <span x-text="slaveLoading ? 'Connecting...' : 'Connect Machine'"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- Advanced Risk Settings Modal -->
    <div x-show="showRiskModal" style="display: none;"
        class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-backdrop" @click="showRiskModal = false" x-transition.opacity></div>

        <div
            class="glass-card relative z-10 w-full max-w-2xl p-6 animate-fade-in shadow-2xl border-white/10 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5 pb-4 border-b border-white/5">
                <div>
                    <h3 class="text-xl font-bold text-white outfit">Risk Settings</h3>
                    <p class="text-xs text-purple-400 font-mono mt-1"
                        x-text="'#' + (activeRiskSlave ? activeRiskSlave.login : '')"></p>
                </div>
                <button @click="showRiskModal = false"
                    class="p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors"><i
                        data-feather="x" class="w-4 h-4"></i></button>
            </div>

            <form @submit.prevent="saveRiskSettings" class="space-y-6">
                <!-- Sizing -->
                <div>
                    <h4 class="text-sm font-semibold text-white mb-3 flex items-center gap-2"><i
                            data-feather="pie-chart" class="w-4 h-4 text-purple-400"></i> Lot Sizing Method</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="lotMode" value="multiplier" x-model="riskConfig.lot_mode"
                                class="sr-only peer">
                            <div
                                class="p-3 rounded-xl border border-white/10 bg-black/20 peer-checked:border-purple-500 peer-checked:bg-purple-500/10 transition-all text-center">
                                <div class="text-xs font-bold text-white mb-1">Multiplier</div>
                                <div class="text-[10px] text-slate-400">Master × Ratio</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="lotMode" value="fixed" x-model="riskConfig.lot_mode"
                                class="sr-only peer">
                            <div
                                class="p-3 rounded-xl border border-white/10 bg-black/20 peer-checked:border-blue-500 peer-checked:bg-blue-500/10 transition-all text-center">
                                <div class="text-xs font-bold text-white mb-1">Fixed Lot</div>
                                <div class="text-[10px] text-slate-400">Exact volume</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="lotMode" value="equity_percent" x-model="riskConfig.lot_mode"
                                class="sr-only peer">
                            <div
                                class="p-3 rounded-xl border border-white/10 bg-black/20 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 transition-all text-center">
                                <div class="text-xs font-bold text-white mb-1">Equity %</div>
                                <div class="text-[10px] text-slate-400">Relative risk</div>
                            </div>
                        </label>
                    </div>

                    <div class="mt-3 p-4 bg-white/5 rounded-xl border border-white/5 flex items-center justify-between">
                        <label class="text-xs text-slate-300" x-text="
                            riskConfig.lot_mode === 'multiplier' ? 'Multiplier (e.g. 0.5 for Half):' :
                            riskConfig.lot_mode === 'fixed' ? 'Fixed Lot Size:' : 'Equity Percentage (%):'">
                        </label>
                        <input type="number" step="0.01"
                            class="glass-input px-3 py-1.5 text-sm w-32 text-right font-mono"
                            x-model="riskConfig.lot_value">
                    </div>
                </div>

                <!-- Limits -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h4 class="text-sm font-semibold text-white mb-3 flex items-center gap-2"><i
                                data-feather="shield" class="w-4 h-4 text-blue-400"></i> Execution Limits</h4>
                        <div class="space-y-3">
                            <div>
                                <label class="flex justify-between text-xs text-slate-400 mb-1"><span>Max Slippage
                                        (points)</span> <span x-text="riskConfig.max_slippage"></span></label>
                                <input type="range" min="0" max="500" step="10" x-model="riskConfig.max_slippage"
                                    class="w-full accent-blue-500">
                            </div>
                            <div>
                                <label class="flex justify-between text-xs text-slate-400 mb-1"><span>Max Spread
                                        (points)</span> <span x-text="riskConfig.max_spread"></span></label>
                                <input type="range" min="0" max="1000" step="10" x-model="riskConfig.max_spread"
                                    class="w-full accent-blue-500">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-sm font-semibold text-white mb-3 flex items-center gap-2"><i
                                data-feather="trending-down" class="w-4 h-4 text-red-400"></i> Financial Stops</h4>
                        <div class="space-y-3">
                            <div
                                class="flex items-center justify-between bg-black/20 p-2 rounded-lg border border-white/5">
                                <span class="text-xs text-slate-400">Daily Max Drawdown ($)</span>
                                <input type="number" x-model="riskConfig.max_daily_drawdown_usd"
                                    class="glass-input px-2 py-1 w-20 text-right text-xs bg-transparent border-0 ring-1 ring-white/10 focus:ring-red-400"
                                    placeholder="0">
                            </div>
                            <div
                                class="flex items-center justify-between bg-black/20 p-2 rounded-lg border border-white/5">
                                <span class="text-xs text-slate-400">Daily Target Profit ($)</span>
                                <input type="number" x-model="riskConfig.daily_target_profit"
                                    class="glass-input px-2 py-1 w-20 text-right text-xs bg-transparent border-0 ring-1 ring-white/10 focus:ring-emerald-400"
                                    placeholder="0">
                            </div>
                            <div
                                class="flex items-center justify-between bg-black/20 p-2 rounded-lg border border-white/5">
                                <span class="text-xs text-slate-400">Direction Filter</span>
                                <select x-model="riskConfig.allowed_directions"
                                    class="glass-input px-2 py-1 w-24 text-xs bg-slate-900 border-0 ring-1 ring-white/10 focus:ring-blue-400 appearance-none">
                                    <option value="both">Both</option>
                                    <option value="buy">Buy Only</option>
                                    <option value="sell">Sell Only</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-white/5">
                    <button type="button" @click="showRiskModal = false"
                        class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">Cancel</button>
                    <button type="submit"
                        class="px-6 py-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-lg text-sm font-medium shadow-[0_0_15px_rgba(59,130,246,0.4)] transition-all">
                        <i x-show="settingsLoading" data-feather="loader" class="w-4 h-4 mr-2 animate-spin inline"
                            style="display:none;"></i>
                        Save Settings
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    function accountsPanel() {
        return {
            master: null,
            slaves: [],

            showAddSlave: false,
            slaveLoading: false,
            slaveMessage: '',
            slaveSuccess: false,
            newSlave: { login: '', password: '', server: '' },

            showRiskModal: false,
            activeRiskSlave: null,
            settingsLoading: false,
            riskConfig: {
                lot_mode: 'multiplier',
                lot_value: 1.0,
                max_slippage: 50,
                max_spread: 100,
                max_daily_drawdown_usd: 0,
                daily_target_profit: 0,
                allowed_directions: 'both'
            },

            async init() {
                await this.loadAccounts();
                setInterval(() => {
                    if (!this.showAddSlave && !this.showRiskModal) {
                        this.loadAccounts();
                    }
                }, 5000);
            },

            async loadAccounts() {
                try {
                    const res = await fetch('/api/v1/accounts');
                    const data = await res.json();
                    const accounts = data.accounts || [];
                    this.master = accounts.find(a => a.role === 'master') || null;
                    this.slaves = accounts.filter(a => a.role === 'slave');
                } catch (e) { console.error(e); }
            },

            async addSlave() {
                this.slaveLoading = true;
                this.slaveMessage = '';
                try {
                    const form = new FormData();
                    form.append('login', this.newSlave.login.trim());
                    form.append('password', this.newSlave.password.trim());
                    form.append('server', this.newSlave.server.trim());
                    form.append('role', 'slave');

                    const res = await fetch('/api/v1/accounts/add', { method: 'POST', body: form });
                    const data = await res.json();

                    if (data.success) {
                        this.slaveSuccess = true;
                        this.slaveMessage = data.mt5_validated ? 'Worker Connected!' : 'Saved (Auth failed — check credentials)';
                        this.newSlave = { login: '', password: '', server: '' };
                        await this.loadAccounts();

                        if (data.mt5_validated) {
                            setTimeout(() => { this.showAddSlave = false; this.slaveMessage = ''; }, 1500);
                        }
                    } else {
                        this.slaveSuccess = false;
                        this.slaveMessage = data.error || 'Failed';
                    }
                } catch (e) {
                    this.slaveSuccess = false;
                    this.slaveMessage = e.message;
                }
                this.slaveLoading = false;
            },

            async toggleSlave(login) {
                await fetch(`/api/v1/accounts/toggle/${login}`, { method: 'POST' });
                await this.loadAccounts();
            },

            async removeSlave(login) {
                if (confirm('Permanently remove this slave node and kill its worker?')) {
                    await fetch(`/api/v1/accounts/remove/${login}`, { method: 'POST' });
                    await this.loadAccounts();
                }
            },

            openRiskSettings(slave) {
                this.activeRiskSlave = slave;
                let settings = {};
                try { settings = JSON.parse(slave.settings_json || '{}'); } catch (e) { }

                // Load or defaults
                this.riskConfig.lot_mode = settings.lot_mode || 'multiplier';

                if (this.riskConfig.lot_mode === 'multiplier') this.riskConfig.lot_value = settings.lot_multiplier || 1.0;
                else if (this.riskConfig.lot_mode === 'fixed') this.riskConfig.lot_value = settings.fixed_lot || 0.01;
                else this.riskConfig.lot_value = settings.equity_percent || 1.0;

                this.riskConfig.max_slippage = settings.max_slippage || 50;
                this.riskConfig.max_spread = settings.max_spread || 100;
                this.riskConfig.max_daily_drawdown_usd = settings.max_daily_drawdown_usd || 0;
                this.riskConfig.daily_target_profit = settings.daily_target_profit || 0;
                this.riskConfig.allowed_directions = settings.allowed_directions || 'both';

                this.showRiskModal = true;
                setTimeout(() => feather.replace(), 50);
            },

            async saveRiskSettings() {
                this.settingsLoading = true;

                let payload = {
                    lot_mode: this.riskConfig.lot_mode,
                    lot_multiplier: this.riskConfig.lot_mode === 'multiplier' ? parseFloat(this.riskConfig.lot_value) : 1.0,
                    fixed_lot: this.riskConfig.lot_mode === 'fixed' ? parseFloat(this.riskConfig.lot_value) : 0.01,
                    equity_percent: this.riskConfig.lot_mode === 'equity_percent' ? parseFloat(this.riskConfig.lot_value) : 1.0,
                    max_slippage: parseInt(this.riskConfig.max_slippage),
                    max_spread: parseInt(this.riskConfig.max_spread),
                    max_daily_drawdown_usd: parseFloat(this.riskConfig.max_daily_drawdown_usd || 0),
                    daily_target_profit: parseFloat(this.riskConfig.daily_target_profit || 0),
                    allowed_directions: this.riskConfig.allowed_directions
                };

                try {
                    await fetch(`/api/v1/accounts/settings/${this.activeRiskSlave.login}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    await this.loadAccounts();
                    this.showRiskModal = false;
                } catch (e) {
                    alert('Failed to save settings');
                }
                this.settingsLoading = false;
            }
        }
    }
</script>
{% endblock %}
