<!-- Position row partial -->
<div class="bg-surface-900/50 rounded-xl p-3 border border-white/5">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span
                class="text-[10px] font-bold px-1.5 py-0.5 rounded {{ 'bg-blue-500/20 text-blue-400' if position.type == 'buy' else 'bg-orange-500/20 text-orange-400' }}">{{
                position.type|upper }}</span>
            <span class="font-semibold text-sm">{{ position.symbol }}</span>
            <span class="text-[10px] text-gray-500">{{ position.volume }}</span>
        </div>
        <div class="text-right">
            <div class="text-sm font-mono font-semibold {{ 'text-profit' if position.profit >= 0 else 'text-loss' }}">
                {{ '+' if position.profit >= 0 else '' }}{{ '%.2f'|format(position.profit) }}
            </div>
        </div>
    </div>
</div>
