{% extends "base.html" %}
{% block content %}
<div class="space-y-6" x-data="historyPanel()" x-init="init()">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-2">
        <h2 class="text-2xl font-bold outfit">Trade History</h2>

        <div class="flex items-center gap-3">
            <!-- Time Window Selector -->
            <div class="glass-card flex items-center p-1 rounded-xl">
                <button @click="setWindow('1d')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors"
                    :class="timeWindow === '1d' ? 'bg-white/10 text-white shadow-sm' : 'text-slate-400 hover:text-slate-300'">1D</button>
                <button @click="setWindow('1w')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors"
                    :class="timeWindow === '1w' ? 'bg-white/10 text-white shadow-sm' : 'text-slate-400 hover:text-slate-300'">1W</button>
                <button @click="setWindow('1m')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors"
                    :class="timeWindow === '1m' ? 'bg-white/10 text-white shadow-sm' : 'text-slate-400 hover:text-slate-300'">1M</button>
            </div>
            <button @click="refreshData()" class="glass-btn p-2 rounded-xl text-slate-400 hover:text-white"
                title="Refresh">
                <i :class="loading ? 'animate-spin' : ''" data-feather="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- History Stats -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-4 relative overflow-hidden group">
            <div
                class="absolute -right-4 -bottom-4 w-16 h-16 bg-blue-500 rounded-full mix-blend-multiply flex items-center justify-center opacity-10 group-hover:opacity-20 transition-opacity">
                <i data-feather="dollar-sign" class="w-8 h-8 text-blue-300"></i>
            </div>
            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">Total Net Profit</div>
            <div class="text-xl font-mono font-bold"
                :class="summary.totalProfit >= 0 ? 'text-emerald-400' : 'text-red-400'"
                x-text="(summary.totalProfit >= 0 ? '+$' : '-$') + Math.abs(summary.totalProfit).toFixed(2)"></div>
        </div>
        <div class="glass-card p-4">
            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">Total Trades</div>
            <div class="text-xl font-mono font-bold text-white px-1" x-text="summary.totalDeals"></div>
        </div>
        <div class="glass-card p-4">
            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">Win Rate</div>
            <div class="text-xl font-mono font-bold text-white relative">
                <span x-text="summary.winRate.toFixed(1) + '%'"></span>
                <div class="absolute bottom-1 right-2 w-16 h-1 bg-slate-800 rounded-full overflow-hidden">
                    <div class="h-full bg-emerald-500" :style="`width: ${summary.winRate}%`"></div>
                </div>
            </div>
        </div>
        <div class="glass-card p-4">
            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">Profit Factor</div>
            <div class="text-xl font-mono font-bold text-white px-1" x-text="summary.profitFactor.toFixed(2)"></div>
        </div>
    </div>

    <!-- History Deals Table -->
    <div class="glass-card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-black/40 text-[10px] uppercase tracking-wider text-slate-400 border-b border-white/5">
                    <tr>
                        <th class="px-5 py-3 font-medium">Time (Local)</th>
                        <th class="px-5 py-3 font-medium">Account</th>
                        <th class="px-5 py-3 font-medium">Symbol</th>
                        <th class="px-5 py-3 font-medium">Direction</th>
                        <th class="px-5 py-3 font-medium text-right">Volume</th>
                        <th class="px-5 py-3 font-medium text-center">SL</th>
                        <th class="px-5 py-3 font-medium text-center">TP</th>
                        <th class="px-5 py-3 font-medium text-right">Price</th>
                        <th class="px-5 py-3 font-medium text-right">Comm/Swap</th>
                        <th class="px-5 py-3 font-medium text-right">Net P&L</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                    <template x-for="deal in displayedDeals" :key="deal.login + deal.ticket">
                        <tr class="hover:bg-white/[0.02] transition-colors group">
                            <td class="px-5 py-3 text-xs text-slate-300" x-text="formatDate(deal.time)"></td>
                            <td class="px-5 py-3 text-xs font-mono text-slate-400" x-text="'#' + deal.login"></td>
                            <td class="px-5 py-3 font-bold text-white" x-text="deal.symbol"></td>
                            <td class="px-5 py-3">
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wider"
                                    :class="deal.type === 0 ? 'bg-blue-500/10 text-blue-400' : (deal.type === 1 ? 'bg-pink-500/10 text-pink-400' : 'bg-slate-800 text-slate-300')"
                                    x-text="getDealType(deal.type)"></span>
                            </td>
                            <td class="px-5 py-3 text-right font-mono" x-text="deal.volume.toFixed(2)"></td>
                            <td class="px-5 py-3 text-center font-mono text-slate-400 text-xs"
                                x-text="deal.sl > 0 ? deal.sl.toFixed(5) : '-'"></td>
                            <td class="px-5 py-3 text-center font-mono text-slate-400 text-xs"
                                x-text="deal.tp > 0 ? deal.tp.toFixed(5) : '-'"></td>
                            <td class="px-5 py-3 text-right font-mono text-slate-300" x-text="deal.price.toFixed(5)">
                            </td>
                            <td class="px-5 py-3 text-right font-mono text-slate-400 text-xs">
                                <span x-text="(deal.commission + deal.swap).toFixed(2)"></span>
                            </td>
                            <td class="px-5 py-3 text-right font-mono font-bold"
                                :class="deal.profit >= 0 ? 'text-emerald-400' : 'text-red-400'">
                                <span
                                    x-text="(deal.profit >= 0 ? '+$' : '-$') + Math.abs(deal.profit).toFixed(2)"></span>
                            </td>
                        </tr>
                    </template>
                    <template x-if="displayedDeals.length === 0 && !loading">
                        <tr>
                            <td colspan="8" class="px-5 py-12 text-center">
                                <i data-feather="inbox" class="w-8 h-8 mx-auto text-slate-600 mb-3"></i>
                                <p class="text-slate-400 text-sm">No trading history found for this period.</p>
                            </td>
                        </tr>
                    </template>
                    <template x-if="loading">
                        <tr>
                            <td colspan="8" class="px-5 py-12 text-center">
                                <i data-feather="loader" class="w-8 h-8 mx-auto text-blue-500 mb-3 animate-spin"></i>
                                <p class="text-slate-400 text-sm">Loading history data...</p>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="px-5 py-3 border-t border-white/5 bg-black/20 flex items-center justify-between"
            x-show="deals.length > 0">
            <div class="text-xs text-slate-500">
                Showing <span class="font-bold text-slate-300" x-text="(currentPage - 1) * perPage + 1"></span> to <span
                    class="font-bold text-slate-300" x-text="Math.min(currentPage * perPage, deals.length)"></span> of
                <span class="font-bold text-slate-300" x-text="deals.length"></span> entries
            </div>
            <div class="flex gap-1">
                <button @click="currentPage--" :disabled="currentPage === 1"
                    class="px-2 py-1 rounded bg-white/5 hover:bg-white/10 text-slate-300 disabled:opacity-30 transition-colors"><i
                        data-feather="chevron-left" class="w-4 h-4"></i></button>
                <button @click="currentPage++" :disabled="currentPage * perPage >= deals.length"
                    class="px-2 py-1 rounded bg-white/5 hover:bg-white/10 text-slate-300 disabled:opacity-30 transition-colors"><i
                        data-feather="chevron-right" class="w-4 h-4"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    function historyPanel() {
        return {
            deals: [],
            loading: false,
            timeWindow: '1w', // 1d, 1w, 1m

            currentPage: 1,
            perPage: 25,

            summary: {
                totalDeals: 0,
                totalProfit: 0,
                winRate: 0,
                profitFactor: 0
            },

            get displayedDeals() {
                const start = (this.currentPage - 1) * this.perPage;
                return this.deals.slice(start, start + this.perPage);
            },

            init() {
                this.refreshData();
            },

            setWindow(w) {
                this.timeWindow = w;
                this.currentPage = 1;
                this.refreshData();
            },

            async refreshData() {
                this.loading = true;
                this.deals = [];

                // Calc timestamps
                const now = Math.floor(Date.now() / 1000);
                let from_ts = now - (7 * 86400); // 1w default
                if (this.timeWindow === '1d') from_ts = now - 86400;
                if (this.timeWindow === '1m') from_ts = now - (30 * 86400);

                try {
                    const res = await fetch(`/api/v1/history/trades?limit=500`);
                    const data = await res.json();

                    let allDeals = [];
                    for (const d of (data.trades || [])) {
                        d.login = d.account_login;
                        d.time = (new Date(d.timestamp)).getTime() / 1000;
                        d.profit = d.profit || 0;
                        // History already contains closed deals
                        allDeals.push(d);
                    }

                    allDeals.sort((a, b) => b.time - a.time);
                    this.deals = allDeals;

                    this.calculateSummary();
                } catch (e) { }

                this.loading = false;
                setTimeout(() => { feather.replace(); }, 50);
            },

            calculateSummary() {
                let grossProfit = 0;
                let grossLoss = 0;
                let winners = 0;
                let net = 0;

                // Only count deals that closed a position (have profit > 0 or < 0, or are explicit close)
                const closedDeals = this.deals.filter(d => d.profit !== 0);

                this.summary.totalDeals = closedDeals.length;

                closedDeals.forEach(d => {
                    const pnl = d.profit + d.commission + d.swap;
                    net += pnl;
                    if (pnl >= 0) {
                        grossProfit += pnl;
                        winners++;
                    } else {
                        grossLoss += Math.abs(pnl);
                    }
                });

                this.summary.totalProfit = net;
                this.summary.winRate = closedDeals.length > 0 ? (winners / closedDeals.length) * 100 : 0;
                this.summary.profitFactor = grossLoss > 0 ? (grossProfit / grossLoss) : (grossProfit > 0 ? 99 : 0);
            },

            formatDate(ts) {
                if (!ts) return '';
                const d = new Date(ts * 1000);
                return d.toLocaleString(undefined, {
                    month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            },

            getDealType(type) {
                const map = { 0: 'BUY', 1: 'SELL', 2: 'BALANCE', 3: 'CREDIT' };
                return map[type] || 'UNKNOWN';
            }
        }
    }
</script>
{% endblock %}
