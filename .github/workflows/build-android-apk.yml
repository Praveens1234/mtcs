name: Build MTCS Mobile APK

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: stable
          cache: true

      - name: Bootstrap Flutter project files
        run: flutter create --platforms=android --project-name mtcs_mobile --org com.mtcs.mobile .

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtcs-mobile-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
